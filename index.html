<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shradha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(160deg, #14101f 0%, #251b3d 40%, #362a55 70%, #4a3a6e 100%);
      overflow: hidden;
      opacity: 0;
      filter: blur(14px) brightness(0.6);
      animation: sceneReveal 1.1s ease-out forwards;
    }
    @keyframes sceneReveal {
      to {
        opacity: 1;
        filter: blur(0px) brightness(1);
      }
    }
    .card {
      text-align: center;
      color: #fff;
    }
    .card p {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      opacity: 0;
      transform: translateY(15px);
      animation: lineIn 0.9s ease-out 0.3s forwards;
    }
    .card h1 {
      margin: 14px 0 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 4.2rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: rgba(255, 255, 255, 0.92);
      opacity: 0;
      transform: translateY(15px);
      animation: lineIn 0.9s ease-out 0.7s forwards;
    }
    @keyframes lineIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <p>Hey there</p>
    <h1>I&rsquo;m Shradha</h1>
  </div>
</body>
</html>
